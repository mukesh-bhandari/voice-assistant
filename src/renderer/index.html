<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="../../index.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden text-slate-50 bg-[linear-gradient(135deg,#0f172a_0%,#1e293b_50%,#0f172a_100%)]">
    <!-- Background Effects -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute -top-40 -right-40 h-80 w-80 rounded-full bg-slate-500 opacity-[0.15] blur-[80px] animate-pulse-slow"></div>
      <div class="absolute -bottom-40 -left-40 h-80 w-80 rounded-full bg-slate-600 opacity-[0.15] blur-[80px] animate-pulse-slow [animation-delay:3s]"></div>
      <div class="absolute top-40 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-slate-700 opacity-[0.15] blur-[80px] animate-pulse-slow [animation-delay:6s]"></div>
    </div>

    <div class="relative z-10 flex min-h-screen flex-col items-center justify-center p-8 max-md:p-4">
      <!-- Header -->
      <div class="mb-12 text-center">
        <h1 class="mb-4 text-[3.5rem] font-light tracking-tight text-slate-50 max-md:text-[2.5rem]">
          <span class="bg-gradient-to-r from-slate-200 to-slate-300 bg-clip-text font-normal text-transparent">Voice</span>
          <span>Assistant</span>
        </h1>
        <p class="text-lg font-light text-slate-400">Speak naturally, I'm listening</p>
      </div>

      <!-- Main Voice Interface -->
      <div class="relative mb-12">
        <!-- Listening Animation Rings -->
        <div id="listening-rings" class="absolute inset-0 hidden">
          <div class="absolute inset-0 rounded-full border-2 border-slate-500 opacity-30 animate-ping-slow"></div>
          <div class="absolute inset-3 rounded-full border-2 border-slate-600 opacity-20 animate-ping-slow [animation-delay:1s]"></div>
          <div class="absolute inset-6 rounded-full border-2 border-slate-700 opacity-10 animate-ping-slow [animation-delay:2s]"></div>
        </div>

        <!-- Main Microphone Button -->
        <button id="mic-button" class="group relative flex h-28 w-28 cursor-pointer items-center justify-center rounded-full border border-slate-400/20 bg-[linear-gradient(135deg,#475569,#334155)] shadow-[0_20px_40px_-12px_rgba(0,0,0,0.4)] transition-all duration-300 hover:scale-105 hover:bg-[linear-gradient(135deg,#64748b,#475569)] hover:shadow-[0_25px_50px_-12px_rgba(71,85,105,0.3)] active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-slate-500 max-md:h-22 max-md:w-22">
          <!-- Microphone Icon -->
          <svg class="h-10 w-10 text-slate-50 transition-transform duration-300 group-hover:scale-110 max-md:h-8 max-md:w-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>

          <!-- Pulse Effect -->
          <div class="absolute inset-0 rounded-full bg-[linear-gradient(135deg,#475569,#334155)] opacity-20 animate-pulse-soft"></div>
        </button>

        <!-- Status Text -->
        <div class="mt-6 text-center text-base font-normal text-slate-400">
          <p id="status-text">Tap to start listening</p>
        </div>
      </div>

      <!-- Transcript Area -->
      <div class="w-full max-w-4xl">
        <div class="rounded-2xl border border-slate-400/10 bg-slate-900/70 p-8 shadow-[0_20px_40px_-12px_rgba(0,0,0,0.3)] backdrop-blur-xl">
          <div class="mb-4 flex items-center">
            <div class="mr-3 h-2 w-2 rounded-full bg-emerald-500 animate-pulse-soft"></div>
            <h3 class="text-base font-medium text-slate-200">Transcript</h3>
          </div>

          <div id="transcript" class="max-h-96 min-h-48 overflow-y-auto rounded-xl border border-slate-400/5 bg-black/20 p-6">
            <p data-placeholder class="py-8 text-center text-sm italic text-slate-500">Your conversation will appear here...</p>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="mt-8 flex gap-3 max-md:flex-wrap max-md:justify-center">
        <button id="clear-btn" class="flex cursor-pointer items-center rounded-xl border border-slate-400/10 bg-slate-900/60 px-5 py-3 text-sm font-normal text-slate-300 backdrop-blur-2xl transition-all duration-300 hover:-translate-y-px hover:border-slate-400/20 hover:bg-slate-800/80 hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500">
          <svg class="mr-2 h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 7h-3V6a4 4 0 0 0-8 0v1H5a1 1 0 0 0-1 1v11a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V8a1 1 0 0 0-1-1zM10 6a2 2 0 0 1 4 0v1h-4V6zm6 16H8a1 1 0 0 1-1-1V9h2v1a1 1 0 0 0 2 0V9h2v1a1 1 0 0 0 2 0V9h2v12a1 1 0 0 1-1 1z"/>
          </svg>
          Clear
        </button>

        <button id="save-btn" class="flex cursor-pointer items-center rounded-xl border border-slate-400/10 bg-slate-900/60 px-5 py-3 text-sm font-normal text-slate-300 backdrop-blur-2xl transition-all duration-300 hover:-translate-y-px hover:border-slate-400/20 hover:bg-slate-800/80 hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500">
          <svg class="mr-2 h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          Save
        </button>

        <button id="settings-btn" class="flex cursor-pointer items-center rounded-xl border border-slate-400/10 bg-slate-900/60 px-5 py-3 text-sm font-normal text-slate-300 backdrop-blur-2xl transition-all duration-300 hover:-translate-y-px hover:border-slate-400/20 hover:bg-slate-800/80 hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500">
          <svg class="mr-2 h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          Settings
        </button>
      </div>

      <!-- Voice Visualizer -->
      <div class="mt-8 flex items-center justify-center gap-1 opacity-60">
        <div class="h-4 w-1 rounded-sm bg-slate-500 animate-pulse-fast"></div>
        <div class="h-6 w-1 rounded-sm bg-slate-600 animate-pulse-fast [animation-delay:0.1s]"></div>
        <div class="h-5 w-1 rounded-sm bg-slate-700 animate-pulse-fast [animation-delay:0.2s]"></div>
        <div class="h-8 w-1 rounded-sm bg-slate-500 animate-pulse-fast [animation-delay:0.3s]"></div>
        <div class="h-3 w-1 rounded-sm bg-slate-600 animate-pulse-fast [animation-delay:0.4s]"></div>
        <div class="h-7 w-1 rounded-sm bg-slate-700 animate-pulse-fast [animation-delay:0.5s]"></div>
        <div class="h-4 w-1 rounded-sm bg-slate-500 animate-pulse-fast [animation-delay:0.6s]"></div>
      </div>
    </div>

    <script src="renderer.js" defer></script>
  </body>
</html>
